name: login-system

services:
  app:
    build:
      context: .
      target: runtime
    image: login-system:latest
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /app/data/login.db
      SECURE_COOKIES: "${SECURE_COOKIES:-0}"
    volumes:
      - login-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  login-data:
